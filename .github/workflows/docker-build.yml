name: CI 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up 
        uses: docker/setup-buildx-action@v3


      - name: Test 
        run: |
          echo "Building microservices to test for errors..."
          docker compose build
  push-to-ecr:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: rag-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building and pushing backend image to ECR..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
  deploy-to-ec2:
    needs: push-to-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_REGION: "ap-southeast-2"
          ECR_REGISTRY: "575491069891.dkr.ecr.ap-southeast-2.amazonaws.com"
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          envs: AWS_ACCESS_KEY,AWS_SECRET_KEY,AWS_REGION,ECR_REGISTRY,IMAGE_TAG,GEMINI_API_KEY
          script: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            sudo apt-get update && sudo apt-get install -y unzip
            unzip -q -o awscliv2.zip
            sudo ./aws/install --update
            mkdir -p nginx
            cat << 'EONGINX' > nginx/nginx.conf
            upstream fastapi_backend {
              server backend:8080;
            }
            server {
              listen 80;
              location / {
                  proxy_pass http://fastapi_backend;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_read_timeout 120s;
              }
            }
            EONGINX
            cat << EOF > docker-compose.yml
            version: '3.8'
            services:
              backend:
                image: $ECR_REGISTRY/rag-backend:$IMAGE_TAG
                volumes:
                  - ./faiss_data:/data
                environment:
                  - GEMINI_API_KEY=$GEMINI_API_KEY
                restart: always
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
              nginx:
                image: nginx:latest
                ports:
                - "80:80"
                volumes:
                - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
                depends_on:
                - backend
                restart: always
            EOF
            export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY
            export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_KEY
            export AWS_DEFAULT_REGION=$AWS_REGION
            /usr/local/bin/aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            
            docker compose pull
            docker compose up -d
            docker system prune -af --volumes
