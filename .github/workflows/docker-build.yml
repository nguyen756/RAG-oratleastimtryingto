name: CI 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up 
        uses: docker/setup-buildx-action@v3


      - name: Test 
        run: |
          echo "Building microservices to test for errors..."
          docker-compose build